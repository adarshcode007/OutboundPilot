version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: outboundsdr_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: outboundsdr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outboundsdr_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URI: postgresql://postgres:postgrespassword@postgres:5432/outboundsdr
      PORT: 8000
      COOKIE_SECURE: "false" # Set to "true" when behind HTTPS in production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/scheduler/status"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

